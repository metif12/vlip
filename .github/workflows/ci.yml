name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          # Pinned, not `latest`. This code targets V 0.5.2: it needs `-cc gcc`,
          # and its module layout relies on that version's vlib lookup order. A
          # newer compiler resolves `import vlib.vlip.reader` against its own
          # standard library and reports "unknown function" for a module that
          # compiles locally, which is exactly the kind of drift a green CI run
          # hides. Change this deliberately, not by accident.
          curl -fsSL https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip -o v.zip
          unzip -q v.zip
          # The archive unpacks to a full V tree -- v/v, v/vlib/, v/makev.bat and
          # so on -- not to a bare binary. Two wrong moves were tried first:
          # `install -m755 v` fails with "omitting directory 'v'", and copying out
          # just the executable installs fine but then every project import
          # resolves against V's standard library instead of the project's, so
          # `import vlib.vlip.reader` is reported as an unknown function.
          #
          # Install the whole tree at /usr/local/v and symlink the binary, which
          # is the layout V expects: vlib sits beside the executable.
          test -d v/vlib || { echo "::error::archive has no v/vlib"; exit 1; }
          sudo rm -rf /usr/local/v
          sudo mv v /usr/local/v
          sudo chmod +x /usr/local/v/v
          sudo ln -sf /usr/local/v/v /usr/local/bin/v
          v version

      # `-cc gcc` everywhere: the default C backend in the pinned V release
      # fails on this checkout, and the local tests are run the same way, so CI
      # cannot pass while a developer is seeing something different.
      - name: Build everything
        run: |
          v -cc gcc -o vlip vlip.v
          v -cc gcc -o reader_probe reader_probe.v
          v -cc gcc -o tail tests/tail_calls.v
          v -cc gcc -o non_tail tests/non_tail.v
          v -cc gcc -o loop_forms tests/loop_forms.v

      # These runners print results and do not set an exit code yet, so the
      # output is checked rather than the status. That is listed as a known gap
      # in docs/010-roadmap.md: errors becoming values is what will remove it.
      - name: Run the suites
        run: |
          set -o pipefail
          ./tail        | tee out.txt
          ./non_tail    | tee -a out.txt
          ./loop_forms  | tee -a out.txt
          if grep -qE '^FAIL|panic' out.txt; then
            echo "::error::a check failed or the machine panicked"
            exit 1
          fi

      - name: Every example parses
        run: ./reader_probe examples/*.lip
