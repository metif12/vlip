name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The compiler this project is developed against, pinned. Not the 0.5.2
  # release: vlang/v master at 0137eb5 also reports itself as "V 0.5.2", but it
  # is a different build.
  #
  # A CI runner that installs a different compiler than the developer is worse
  # than no CI: it reports a failure that does not reproduce locally, or -- far
  # worse -- passes while checking something other than what is shipped.
  V_COMMIT: 0137eb5d8ebc5d183259309ed08ea06ba9bc27d6

  # On macOS, Linux and BSD `v` tries its experimental V3 compiler first and
  # silently falls back to the established one when V3 declines the program. The
  # two resolve `import vlib.blip.reader` differently -- the established one
  # looks in V's standard library and reports every module here as unknown --
  # so the fallback turned a working build into a wall of "unknown function"
  # errors naming files that exist and compile locally.
  #
  # Refusing the fallback makes Linux behave like the Windows development
  # machine instead of quietly testing a different compiler.
  V_MACOS_V3_NO_FALLBACK: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the V compiler
        id: vcache
        uses: actions/cache@v4
        with:
          path: v
          key: v-${{ env.V_COMMIT }}

      - name: Build V
        if: steps.vcache.outputs.cache-hit != 'true'
        run: |
          # No release archive: the prebuilt ones are a different compiler, and
          # installing only the executable out of one leaves V unable to find
          # the vlib beside it. Build the pinned commit instead.
          git init -q v
          cd v
          git remote add origin https://github.com/vlang/v.git
          git fetch -q --depth 1 origin "$V_COMMIT"
          git checkout -q FETCH_HEAD
          make

      - name: Put V on PATH
        run: echo "$GITHUB_WORKSPACE/v" >> "$GITHUB_PATH"

      - name: Confirm the toolchain
        run: |
          v version
          gcc --version | head -n 1

      # The generated prims must match the compiler they were read from. A
      # V_COMMIT bump that changes vlib fails here until tools/genprims.vsh
      # is re-run and the result reviewed -- see docs/010-roadmap.md 7.1.
      - name: Generated prims are current
        run: v -cc gcc run tools/genprims.vsh --check

      # `-cc gcc` everywhere, matching the local build commands in the README.
      # The default C backend fails on this checkout.
      - name: Build everything
        run: |
          v -cc gcc -o blip blip.v
          v -cc gcc -o reader_probe reader_probe.v
          v -cc gcc -o tail tests/tail_calls.v
          v -cc gcc -o non_tail tests/non_tail.v
          v -cc gcc -o loop_forms tests/loop_forms.v
          v -cc gcc -o binding_forms tests/binding_forms.v
          v -cc gcc -o embedding tests/embedding.v
          v -cc gcc -o repl_golden tests/repl_golden.v
          v -cc gcc -o examples_run tests/examples_run.v
          v -cc gcc -o programs_run tests/programs_run.v
          v -cc gcc -o genprims tests/genprims.v

      # These runners print results and do not set an exit code yet, so the
      # output is checked rather than the status. That is listed as a known gap
      # in docs/010-roadmap.md: errors becoming values is what will remove it.
      - name: Run the suites
        run: |
          set -o pipefail
          ./tail           | tee out.txt
          ./non_tail       | tee -a out.txt
          ./loop_forms     | tee -a out.txt
          ./binding_forms  | tee -a out.txt
          ./embedding      | tee -a out.txt
          ./repl_golden    | tee -a out.txt
          ./examples_run   | tee -a out.txt
          ./programs_run   | tee -a out.txt
          ./genprims       | tee -a out.txt
          if grep -qE '^FAIL|panic' out.txt; then
            echo "::error::a check failed or the machine panicked"
            exit 1
          fi

      - name: Every example parses
        run: ./reader_probe examples/*.lip
